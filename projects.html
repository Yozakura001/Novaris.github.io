<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Novaris</title>
    <meta name="description" content="Projects by Novaris — software, automation tools, and intelligent digital solutions. Free public downloads.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>

    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="nav container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="Novaris logo">
                <span>Novaris</span>
            </a>
            <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-head">
            <div class="container">
                <p class="section-label reveal">Projects</p>
                <h1 class="page-title reveal reveal-delay-1">What we build</h1>
                <p class="section-intro reveal reveal-delay-2">
                    Free and public downloads. Search, filter by tag, and download
                    the latest versions.
                </p>
            </div>
        </section>

        <section class="section section-tight" style="padding-top:0;">
            <div class="container">

                <div class="filters reveal">
                    <input type="text" id="search" class="search-input" placeholder="Search projects..." autocomplete="off">
                    <div class="tags-filter" id="tags-filter">
                        <button class="tags-btn" id="tags-btn" aria-haspopup="true" aria-expanded="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                            <span>Tags</span>
                            <span class="tags-count" id="tags-count" hidden>0</span>
                            <svg class="tags-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="tags-menu" id="tags-menu" hidden>
                            <div id="tags-options"></div>
                        </div>
                    </div>
                </div>

                <div class="projects-grid" id="projects-grid">
                    <p class="empty-state" id="empty-state" hidden>No projects match your search.</p>
                </div>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="assets/logo.png" alt="Novaris logo">
                <span>Novaris</span>
            </div>
            <p class="footer-tag">Building the future.</p>
            <p class="footer-copy">© <span id="year"></span> Novaris. All rights reserved.</p>
        </div>
    </footer>

    <!-- ============ DOWNLOAD MODAL ============ -->
    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <span class="modal-accent" aria-hidden="true"></span>
            <button class="modal-close" id="modal-close" aria-label="Close">×</button>
            <div class="modal-head">
                <div class="modal-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </div>
                <div>
                    <p class="modal-kicker">Novaris Project</p>
                    <h3 class="modal-title" id="modal-title"></h3>
                </div>
            </div>
            <p class="modal-desc" id="modal-desc"></p>
            <p class="modal-section-label">Versions</p>
            <div class="modal-versions" id="modal-versions"></div>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>

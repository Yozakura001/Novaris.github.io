<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Novaris</title>
    <meta name="description" content="Projects by Novaris — software, automation tools, and intelligent digital solutions. Free public downloads.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

    <header class="site-header">
        <nav class="nav container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="Novaris logo">
                <span>Novaris</span>
            </a>
            <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page">

        <section class="section page-head">
            <div class="container">
                <p class="section-label">Projects</p>
                <h1 class="page-title">What we build</h1>
                <p class="section-intro">
                    Free and public downloads. Search, filter by tag, and download
                    the latest versions.
                </p>
            </div>
        </section>

        <section class="section page-content">
            <div class="container">

                <div class="filters">
                    <input type="text" id="search" class="search-input" placeholder="Search projects..." autocomplete="off">
                    <div class="tags-filter" id="tags-filter"></div>
                </div>

                <div class="projects-grid" id="projects-grid">
                    <p class="empty-state" id="empty-state" hidden>No projects match your search.</p>
                </div>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="assets/logo.png" alt="Novaris logo">
                <span>Novaris</span>
            </div>
            <p class="footer-tag">Building the future.</p>
            <p class="footer-copy">© <span id="year"></span> Novaris. All rights reserved.</p>
        </div>
    </footer>

    <!-- ============ DOWNLOAD MODAL ============ -->
    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal-close" id="modal-close" aria-label="Close">×</button>
            <h3 class="modal-title" id="modal-title"></h3>
            <p class="modal-desc" id="modal-desc"></p>
            <div class="modal-versions" id="modal-versions"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

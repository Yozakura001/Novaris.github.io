<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Novaris</title>
    <meta name="description" content="Contact Novaris — questions, feedback, or collaboration.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

    <header class="site-header">
        <nav class="nav container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="Novaris logo">
                <span>Novaris</span>
            </a>
            <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page">

        <section class="section page-head">
            <div class="container">
                <p class="section-label">Contact</p>
                <h1 class="page-title">Get in touch</h1>
                <p class="section-intro">
                    Questions, feedback, or collaboration — we are always open to a good conversation.
                </p>
            </div>
        </section>

        <section class="section page-content">
            <div class="container">
                <form class="contact-form" action="#" method="post">
                    <div class="form-row">
                        <input type="text" name="name" placeholder="Your name" required>
                        <input type="email" name="email" placeholder="Your email" required>
                    </div>
                    <textarea name="message" rows="5" placeholder="Your message" required></textarea>
                    <button type="submit" class="btn btn-primary">Send message</button>
                </form>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="assets/logo.png" alt="Novaris logo">
                <span>Novaris</span>
            </div>
            <p class="footer-tag">Building the future.</p>
            <p class="footer-copy">© <span id="year"></span> Novaris. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
